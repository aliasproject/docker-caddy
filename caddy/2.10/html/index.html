<html>
    <head>
        <title>Alios activated!</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <style>
            * {
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }

            body {
                /* background: #e9e9e9; */
                font-family: sans-serif;
                font-size: 14px;
                -webkit-font-smoothing: antialiased;
                background: #fff;
                color: #666;

                @media (prefers-color-scheme: dark) {
                    color: #999;
                }

                b,
                strong {
                    color: #000;

                    @media (prefers-color-scheme: dark) {
                        color: #fff;
                    }
                }

                &:after {
                    content: "";
                    width: 100%;
                    height: 100%;
                    position: fixed;
                    left: 0;
                    top: 0;
                    right: 0;
                    bottom: 0;
                    z-index: -1;
                    pointer-events: none;
                    background: radial-gradient(
                        at top,
                        rgba(226, 232, 240, 0.5) 60%,
                        rgba(203, 213, 225, 0.5) 80%
                    );

                    @media (prefers-color-scheme: dark) {
                        background: radial-gradient(
                            at top,
                            rgba(0, 15, 30, 1) 40%,
                            rgba(0, 0, 0, 1) 80%
                        );
                    }
                }
            }

            .container {
                display: flex;
                flex-wrap: wrap;
                flex-direction: column;
                min-height: 100vh;

                .content {
                    flex: 1;
                    display: flex;
                    flex-wrap: wrap;
                    align-items: center;
                    width: 100%;
                    max-width: 600px;
                    margin: 0 auto;

                    .shell {
                        width: 100%;
                        position: relative;
                        margin: 30px 10px;
                        padding-bottom: 60px;
                        background: linear-gradient(
                            0deg,
                            rgb(255, 255, 255, 0) 0%,
                            rgb(255, 255, 255, 1) 50%,
                            rgb(255, 255, 255, 0) 100%
                        );

                        @media (prefers-color-scheme: dark) {
                            background: linear-gradient(
                                0deg,
                                rgb(0, 0, 0, 0) 0%,
                                rgb(0, 0, 0, 0.15) 50%,
                                rgb(0, 0, 0, 0) 100%
                            );
                        }

                        &:before,
                        &:after {
                            content: "";
                            width: 10px;
                            height: 100%;
                            position: absolute;
                            top: 0;
                            left: -10px;
                            mask-image: linear-gradient(
                                to bottom,
                                transparent 0%,
                                black 50%,
                                transparent 100%
                            );
                            background: linear-gradient(
                                90deg,
                                rgb(0, 0, 0, 0) 0%,
                                rgb(0, 0, 0, 0.03) 100%
                            );

                            @media (prefers-color-scheme: dark) {
                                background: linear-gradient(
                                    90deg,
                                    rgb(0, 0, 0, 0) 0%,
                                    rgb(0, 0, 0, 0.5) 100%
                                );
                            }
                        }

                        &:after {
                            right: -10px;
                            left: unset;
                            background: linear-gradient(
                                90deg,
                                rgb(0, 0, 0, 0.03) 0%,
                                rgb(0, 0, 0, 0) 100%
                            );

                            @media (prefers-color-scheme: dark) {
                                background: linear-gradient(
                                    90deg,
                                    rgb(0, 0, 0, 0.5) 0%,
                                    rgb(0, 0, 0, 0) 100%
                                );
                            }
                        }

                        .alios-logo {
                            display: block;
                            width: 120px;
                            margin: 0 auto;

                            @media (prefers-color-scheme: dark) {
                                .path {
                                    fill: #fff !important;
                                }
                            }
                        }

                        .shell-content {
                            max-width: calc(100vw - 20px);
                            margin-bottom: 30px;
                            overflow: auto;

                            @media (min-width: 0px) {
                                padding: 30px 20px;
                            }

                            @media (min-width: 768px) {
                                padding: 30px;
                            }

                            table {
                                width: 100%;
                                margin-right: 20px;
                                border-spacing: 0;
                                border-radius: 3px;

                                thead {
                                    -webkit-font-smoothing: subpixel-antialiased;

                                    tr {
                                        font-size: 14px;
                                        color: #000;

                                        @media (prefers-color-scheme: dark) {
                                            color: #fff;
                                        }

                                        td {
                                            background: rgba(15, 125, 195, 0.1);
                                            padding: 8px 30px 8px 10px;

                                            &:last-child {
                                                width: fit-content;
                                            }
                                        }
                                    }
                                }

                                tbody {
                                    tr {
                                        font-size: 14px;

                                        td {
                                            padding: 8px 30px 8px 10px;
                                            border-top: 1px solid #ccc;

                                            @media (prefers-color-scheme: dark) {
                                                border-top: 1px solid
                                                    rgba(15, 125, 195, 0.15);
                                            }

                                            &:nth-child(2) {
                                                width: 100%;
                                            }

                                            &:last-child {
                                                min-width: 130px;
                                                width: fit-content;
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

            footer {
                width: full;
                max-width: 600px;
                margin: 0 auto;
                height: fit-content;
                color: #666;
                padding: 30px;
                text-align: center;

                @media (prefers-color-scheme: dark) {
                    color: #fff;
                    opacity: 0.5;
                }

                #disclaimer {
                    font-size: 12px;
                    padding-top: 15px;

                    @media (prefers-color-scheme: dark) {
                        opacity: 0.5;
                    }
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="content">
                <div class="shell">
                    <a
                        href="https://alios.app/"
                        title="Alios Deployment"
                        class="alios-logo"
                    >
                        <svg
                            id="Layer_2"
                            xmlns="http://www.w3.org/2000/svg"
                            xmlns:xlink="http://www.w3.org/1999/xlink"
                            viewBox="0 0 117.98 40"
                        >
                            <defs>
                                <linearGradient
                                    id="linear-gradient"
                                    x1="46.5"
                                    y1="20"
                                    x2="58.5"
                                    y2="20"
                                    gradientUnits="userSpaceOnUse"
                                >
                                    <stop offset="0" stop-color="#0d2635" />
                                    <stop offset="1" stop-color="#007dc5" />
                                </linearGradient>
                            </defs>
                            <g id="Layer_1-2">
                                <path
                                    class="path"
                                    d="M96.48,9h21.5v-4h-21.5c-4.69,0-8.5,3.81-8.5,8.5s3.81,8.5,8.5,8.5h13c2.48,0,4.5,2.02,4.5,4.5s-2.02,4.5-4.5,4.5h-21.5v4h21.5c4.69,0,8.5-3.81,8.5-8.5s-3.81-8.5-8.5-8.5h-13c-2.48,0-4.5-2.02-4.5-4.5s2.02-4.5,4.5-4.5Z"
                                    style="fill: #0d2635; stroke-width: 0px"
                                />
                                <path
                                    class="path"
                                    d="M22.14,28.34c-1.92,1.65-4.41,2.66-7.14,2.66-6.07,0-11-4.93-11-11s4.93-11,11-11c6.07,0,11,4.93,11,11v15h4v-15c0-8.28-6.72-15-15-15C6.72,5,0,11.71,0,20c0,8.28,6.72,15,15,15,3.46,0,6.62-1.19,9.16-3.16l-2.02-3.5Z"
                                    style="fill: #0d2635; stroke-width: 0px"
                                />
                                <path
                                    d="M46.5,0h0v17.29c7.24,4.95,12,13.28,12,22.71v-17.3c-7.24-4.95-11.99-13.27-12-22.7Z"
                                    style="
                                        fill: url(#linear-gradient);
                                        stroke-width: 0px;
                                    "
                                />
                                <path
                                    class="path"
                                    d="M80.63,9.4c-1.34-1.36-2.92-2.44-4.76-3.22-1.83-.78-3.79-1.17-5.87-1.17s-4.07.39-5.89,1.17c-1.82.78-3.41,1.85-4.76,3.2-1.35,1.35-2.42,2.94-3.2,4.76-.11.25-.19.5-.28.76.98,1.19,2.07,2.3,3.27,3.28.87-5.2,5.39-9.17,10.84-9.17,6.08,0,11,4.92,11,11s-4.92,11-11,11c-1.91,0-3.71-.49-5.27-1.35l-2,3.47c2.28,1.25,4.71,1.88,7.3,1.88,2.08,0,4.03-.39,5.85-1.17,1.82-.78,3.41-1.85,4.76-3.2,1.35-1.35,2.42-2.94,3.2-4.76.78-1.82,1.17-3.77,1.17-5.85s-.39-4.03-1.17-5.85c-.78-1.82-1.84-3.41-3.18-4.78Z"
                                    style="fill: #0d2635; stroke-width: 0px"
                                />
                                <path
                                    class="path"
                                    d="M41.47,35h12.48c-.3-1.38-.72-2.72-1.26-4h-11.22s0,0,0,0c-2.48,0-4.5-2.02-4.5-4.5h0s0-.02,0-.03V5h-4v21.5s0,0,0,0c0,4.69,3.81,8.5,8.5,8.5Z"
                                    style="fill: #0d2635; stroke-width: 0px"
                                />
                            </g>
                        </svg>
                    </a>

                    <div class="shell-content">
                        <table>
                            <thead>
                                <tr>
                                    <td>Type</td>
                                    <td>Name</td>
                                    <td>Content</td>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td><b>A</b></td>
                                    <td>@</td>
                                    <td id="public-ip">Loading...</td>
                                </tr>
                                <tr>
                                    <td><b>CNAME</b></td>
                                    <td>www</td>
                                    <td>example.com</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <footer>
                <div id="disclaimer">
                    Alios is not responsible for the content, disposition, or
                    behavior of this Web property, which is independently owned
                    and maintained. For inquiries, please contact the site owner
                    or hosting provider.
                </div>
            </footer>
        </div>
        <script>
            fetch("/api/server-ip?format=json")
                .then((response) => response.json())
                .then((data) => {
                    console.log(data);
                    document.getElementById("public-ip").textContent = data.ip;
                })
                .catch((error) => {
                    document.getElementById("public-ip").textContent =
                        "Failed to fetch IP";
                });
        </script>
    </body>
</html>
