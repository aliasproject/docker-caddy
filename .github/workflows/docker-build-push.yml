name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Deliberately NOT ${{ github.repository }} -- this repo is
  # aliasproject/docker-caddy, but every consumer (Alios's
  # ResolvePrebuiltImage, RunReverseProxy, this repo's own README/.zed
  # tasks) expects ghcr.io/aliasproject/caddy.
  IMAGE_NAME: ${{ github.repository_owner }}/caddy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: caddy/2.10
          file: caddy/2.10/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # 2.10-alpine is load-bearing, not cosmetic: Alios's
          # ResolvePrebuiltImage.php resolves the 'static' runtime to
          # exactly ghcr.io/aliasproject/caddy:2.10-alpine, and its
          # CheckForImageUpdates job polls that same tag's manifest digest
          # to drive the "update available" prompt -- so this tag must be
          # re-pushed (not left stale) on every build for that check to
          # ever see a change. latest is what RunReverseProxy.php runs as
          # the platform's single shared reverse-proxy container.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:2.10-alpine
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:2.10-alpine-${{ github.sha }}
          cache-from: type=gha,scope=caddy-2.10
          cache-to: type=gha,mode=max,scope=caddy-2.10

  summary:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## 🐳 Docker Image Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`ghcr.io/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`2.10-alpine\`, \`latest\`, \`2.10-alpine-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push.result == 'success' && '✅ Build successful!' || '❌ Build failed' }}" >> $GITHUB_STEP_SUMMARY
